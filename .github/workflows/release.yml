name: Release

# Push a tag vX.Y.Z after bumping compass.Version and both plugin manifests, rebuilding the plugin
# binaries (make plugin) and committing them. This workflow checks all of that, then publishes the
# release archives for people and agents who install without the plugin or Go.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag matches the binary's version
        run: |
          version=$(sed -n 's/.*Version *= *"\(.*\)"/\1/p' internal/compass/init.go)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, compass.Version $version"; exit 1; }

      - run: make test
      - run: make verify-plugin
      - run: sh tests/smoke.sh
      - run: make dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
